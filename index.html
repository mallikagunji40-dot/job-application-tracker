<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack | Application Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h1 { color: #2563eb; }
        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background: #eff6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>JobTrack</h1>
        <p>Track your job applications in one place.</p>

        <form id="jobForm">
            <input id="company" placeholder="Company Name" required>
            <input id="role" placeholder="Job Role" required>
            <select id="status">
                <option>Applied</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
            </select>
            <button type="submit">Add Application</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="jobList"></tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById("jobForm");
        const jobList = document.getElementById("jobList");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const company = document.getElementById("company").value;
            const role = document.getElementById("role").value;
            const status = document.getElementById("status").value;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${company}</td>
                <td>${role}</td>
                <td>${status}</td>
                <td><button onclick="this.closest('tr').remove()">Delete</button></td>
            `;

            jobList.appendChild(row);
            form.reset();
        });
    </script>
</body>
</html>
